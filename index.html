<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera Remota</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 100%; max-width: 640px; border: 2px solid #0f0; }
        #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="status">Aguardando conexão...</div>
    <!-- O vídeo da pessoa aparecerá aqui -->
    <video id="remoteVideo" autoplay playsinline muted></video> 

    <script>
        // ID fixo para a sala
        const ROOM_ID = 'sala-espiao-v1'; 
        
        const status = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');
        
        // Cria o Peer (Cliente)
        const peer = new Peer();

        peer.on('open', (id) => {
            status.innerText = 'Conectado ao servidor. Aguardando vídeo...';
            
            // Tenta entrar na sala
            const conn = peer.connect(ROOM_ID);
            
            conn.on('open', () => {
                status.innerText = 'Solicitando câmera...';
                
                // Inicia a câmera LOCAL (da pessoa)
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                    .then((localStream) => {
                        status.innerText = 'Enviando vídeo...';
                        
                        // Envia o stream local para a sala
                        const call = peer.call(ROOM_ID, localStream);
                        
                        if (call) {
                            // Quando receber resposta ou fluxo
                            call.on('stream', (remoteStream) => {
                                remoteVideo.srcObject = remoteStream;
                                status.innerText = 'CÂMERA ATIVA!';
                                status.style.color = '#0f0';
                            });
                        }
                    })
                    .catch(err => {
                        status.innerText = 'Erro: ' + err.message;
                    });
            });
        });
        
        // Fallback caso o método acima falhe em algum navegador
        peer.on('call', (call) => {
            call.answer();
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                status.innerText = 'CÂMERA ATIVA!';
            });
        });
    </script>
</body>
</html>
