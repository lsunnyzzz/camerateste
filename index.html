<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera Remota</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { 
            background: #000; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif; 
        }
        video { 
            width: 95%; 
            max-width: 640px; 
            border: 3px solid #0f0; 
            box-shadow: 0 0 20px rgba(0,255,0,0.4);
            background: #111;
        }
        #status { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.9); 
            padding: 10px 20px; 
            border-radius: 5px; 
            font-weight: bold; 
            z-index: 100; 
            text-align: center;
        }
        .active { color: #0f0; border-color: #0f0; }
        button { 
            padding: 20px; 
            font-size: 20px; 
            margin-top: 20px; 
            cursor: pointer; 
            background: #0055ff; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            width: 80%;
            max-width: 300px;
            font-weight: bold;
        }
        button:active { background: #0033aa; }
    </style>
</head>
<body>

    <!-- Status Visual -->
    <div id="status">Aguardando câmera...</div>

    <!-- Onde o vídeo vai aparecer -->
    <video id="remoteVideo" autoplay playsinline muted></video>

    <!-- Botão para ela clicar -->
    <button id="btnSend" onclick="enviarCamera()">CLIQUE PARA ENVIAR CÂMERA</button>

    <script>
        // ID ÚNICO DA SALA - NÃO MEXA NESTE CÓDIGO
        const ROOM_ID = 'monitor-fixo-xyz'; 

        const peer = new Peer(); // Conecta ao servidor gratuito
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('btnSend');
        const videoEl = document.getElementById('remoteVideo');

        // Quando conectar ao servidor
        peer.on('open', () => {
            statusEl.innerText = 'Monitor Online. Aguardando...';
            
            // Modo ESCUTA: Fica esperando alguém chamar
            peer.on('call', (call) => {
                statusEl.innerText = 'Conectando...';
                
                // Aceita automaticamente
                call.answer(); 
                
                // Quando receber o vídeo
                call.on('stream', (stream) => {
                    videoEl.srcObject = stream;
                    statusEl.innerText = 'CÂMERA ATIVA!';
                    statusEl.classList.add('active');
                    
                    // Esconde o botão no PC se quiser
                    // btn.style.display = 'none'; 
                });
            });
        });

        // Função que ela clica no celular
        function enviarCamera() {
            statusEl.innerText = 'Solicitando câmera...';
            
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then((stream) => {
                    statusEl.innerText = 'Enviando vídeo...';
                    
                    // Faz a chamada para a sala fixa
                    const call = peer.call(ROOM_ID, stream);
                    
                    call.on('close', () => {
                        statusEl.innerText = 'Conexão encerrada.';
                        btn.innerText = "TENTAR NOVAMENTE";
                    });
                    
                    call.on('error', (err) => {
                        statusEl.innerText = 'Erro: ' + err;
                    });
                    
                    // Se conseguir enviar, esconde o botão
                    btn.style.display = 'none';
                    statusEl.innerText = 'Transmitindo...';
                })
                .catch((err) => {
                    alert('Não foi possível acessar a câmera: ' + err.message);
                });
        }
    </script>
</body>
</html>
