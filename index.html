<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera Remota</title>
    <!-- Importa a biblioteca PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 100%; max-width: 640px; border: 2px solid #0f0; }
        #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 5px; }
    </style>
</head>
<body>
    <div id="status">Conectando...</div>
    <video id="remoteVideo" autoplay playsinline></video>

    <script>
        // Cria uma conexão PeerJS
        const peer = new Peer('camera-room-1'); // 'camera-room-1' é o nome da sala fixa
        
        const status = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');

        // Quando esta conexão estiver pronta
        peer.on('open', (id) => {
            status.innerText = 'Sala pronta. Aguardando câmera...';
            
            // Se alguém tentar conectar nesta sala
            peer.on('call', (call) => {
                call.answer(); // Aceita a chamada
                
                // Quando receber o vídeo
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    status.innerText = 'CÂMERA ATIVA!';
                    status.style.color = '#0f0';
                });
            });
        });

        // Inicia a câmera local para enviar
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then((localStream) => {
                // Tenta chamar a sala
                const call = peer.call('camera-room-1', localStream);
                
                if (call) {
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                    });
                }
            })
            .catch(err => {
                status.innerText = 'Erro: ' + err.message;
            });
    </script>
</body>
</html>
