<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera Remota - Debug</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: monospace; }
        video { width: 90%; max-width: 600px; border: 2px solid cyan; margin-top: 20px; }
        #log { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 5px; font-size: 12px; text-align: left; z-index: 100; max-height: 200px; overflow: hidden; }
        button { padding: 15px; font-size: 18px; margin-top: 20px; cursor: pointer; background: #0055ff; color: white; border: none; border-radius: 5px; }
        .active { color: #0f0; font-weight: bold; }
    </style>
</head>
<body>
    <div id="log">Log: Iniciando...</div>
    <video id="remoteVideo" autoplay playsinline muted></video>
    <button id="btnSend">CLIQUE AQUI PARA ENVIAR CÂMERA</button>

    <script>
        const ROOM_ID = 'sala-teste-2024'; // ID fixo
        const peer = new Peer();
        const logDiv = document.getElementById('log');
        const btn = document.getElementById('btnSend');
        const video = document.getElementById('remoteVideo');

        function log(msg) {
            logDiv.innerHTML += '<br>> ' + msg;
            console.log(msg);
        }

        peer.on('open', () => {
            log('Conectado ao servidor com ID: ' + peer.id);
            
            // Modo Escuta (Você recebe)
            peer.on('call', (call) => {
                call.answer(); 
                log('Chamada recebida!');
                
                call.on('stream', (stream) => {
                    video.srcObject = stream;
                    log('VÍDEO RECEBIDO COM SUCESSO!');
                    btn.style.background = '#00aa00';
                    btn.innerText = 'CÂMERA ATIVA';
                });
            });
        });

        // Botão para forçar o envio (Ela clica nisso)
        btn.onclick = async () => {
            try {
                log('Solicitando câmera...');
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                
                log('Câmera acessada. Chamando sala...');
                
                // Tenta chamar a sala específica
                const call = peer.call(ROOM_ID, stream);
                
                call.on('close', () => log('Conexão encerrada'));
                call.on('error', err => log('Erro: ' + err));
                
                // Se alguém atender (no caso do PC ouvindo)
                call.on('stream', (remoteStream) => {
                   // Isso raramente ocorre neste fluxo, mas é segurança
                });

            } catch (err) {
                log('Erro ao acessar câmera: ' + err.message);
            }
        };
    </script>
</body>
</html>
