<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera Remota - Monitor</title>
    <!-- Importa PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        video { width: 100%; max-width: 640px; border: 2px solid #0f0; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        #status { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 5px; font-weight: bold; z-index: 100; }
        .active { color: #0f0 !important; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <div id="status">Aguardando Câmera...</div>
    <video id="remoteVideo" autoplay playsinline muted></video>

    <script>
        // ID ÚNICO DA SALA (Mantenha esse mesmo para você e para ela)
        const ROOM_ID = 'monitor-camera-99'; 

        const peer = new Peer(); // Cria conexão anônima
        const statusEl = document.getElementById('status');
        const videoEl = document.getElementById('remoteVideo');

        peer.on('open', (id) => {
            statusEl.innerText = 'Conectado ao servidor. Aguardando sinal...';
            
            // Configura para ESCUTAR chamadas nesta sala
            peer.on('call', (call) => {
                // Aceita a chamada automaticamente
                call.answer(); 
                
                statusEl.innerText = 'Recebendo vídeo...';
                
                // Quando o fluxo de vídeo chegar
                call.on('stream', (stream) => {
                    videoEl.srcObject = stream;
                    statusEl.innerText = 'CÂMERA ATIVA!';
                    statusEl.classList.add('active');
                });
                
                call.on('error', (err) => {
                    statusEl.innerText = 'Erro na conexão: ' + err;
                });
            });
        });

        // Tenta se conectar à sala para garantir que estamos "na mesma frequência"
        // Isso ajuda em alguns casos onde o signaling precisa ser inicializado
        const conn = peer.connect(ROOM_ID);
        conn.on('open', () => {
             statusEl.innerText = 'Sala ativa. Aguardando entrada...';
        });
    </script>
</body>
</html>
