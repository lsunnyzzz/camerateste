<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera Remota Final</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        video { width: 100%; max-width: 640px; border: 2px solid #0f0; }
        #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px; z-index: 10; text-align: center; }
        .connected { color: #0f0; }
        .waiting { color: yellow; }
    </style>
</head>
<body>
    <div id="status" class="waiting">Aguardando conexão...</div>
    <video id="remoteVideo" autoplay playsinline muted></video>

    <script>
        // ID ÚNICO DA SALA
        const ROOM_ID = 'monitor-fixo-xyz'; 

        const peer = new Peer();
        const statusEl = document.getElementById('status');
        const videoEl = document.getElementById('remoteVideo');

        peer.on('open', () => {
            statusEl.innerText = 'Monitor Online. Aguardando entrada...';
            
            // MODO RECEBEDOR (Seu PC)
            peer.on('call', (call) => {
                statusEl.innerText = 'Conectando vídeo...';
                
                // Aceita a chamada
                call.answer(); 
                
                call.on('stream', (stream) => {
                    videoEl.srcObject = stream;
                    statusEl.innerText = 'CÂMERA ATIVA!';
                    statusEl.classList.add('connected');
                });
                
                call.on('error', (err) => {
                    statusEl.innerText = 'Erro: ' + err;
                });
            });
        });

        // Se quiser testar se você mesmo consegue conectar (opcional)
        // Mas o foco é receber.
    </script>
</body>
</html>
