<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera Remota</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 100%; max-width: 640px; border: 2px solid #0f0; }
        #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 5px; font-family: monospace; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">Iniciando...</div>
    <video id="remoteVideo" autoplay playsinline></video>

    <script>
        const ROOM_ID = 'sala-fixa-v2'; 
        const peer = new Peer();
        const status = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');

        peer.on('open', () => {
            status.innerText = 'Aguardando sinal...';
            
            // Tenta conectar à sala
            try {
                const conn = peer.connect(ROOM_ID);
                
                conn.on('open', () => {
                    status.innerText = 'Conectado. Solicitando câmera...';
                    
                    // Inicia A CÂMERA DA PESSOA QUE ABRIU O LINK
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then((stream) => {
                            status.innerText = 'Enviando...';
                            
                            // Chama a sala com o stream da pessoa
                            const call = peer.call(ROOM_ID, stream);
                            
                            call.on('stream', (remoteStream) => {
                                remoteVideo.srcObject = remoteStream;
                                status.innerText = 'CÂMERA ATIVA!';
                                status.style.color = '#0f0';
                            });
                            
                            call.on('error', (err) => {
                                status.innerText = 'Erro na chamada: ' + err;
                            });
                        })
                        .catch(err => {
                            status.innerText = 'Erro ao acessar câmera local: ' + err.message;
                        });
                });
            } catch (e) {
                status.innerText = 'Erro de conexão: ' + e.message;
            }
        });

        // Fallback para conexões diretas
        peer.on('call', (call) => {
            call.answer();
            call.on('stream', (stream) => {
                remoteVideo.srcObject = stream;
                status.innerText = 'CÂMERA ATIVA!';
            });
        });
    </script>
</body>
</html>
